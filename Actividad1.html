<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario SENA V1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="actividad1.css">
</head>
<body>
    <div class="container">
        <h1>FORMULARIO SENA V1</h1>
        <p class="subtitle">GRACIAS POR DEJAR SUS DATOS</p>

        <form>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Please enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Please enter your email">

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Please enter your age">

            <label>Choose an option</label>
            <select>
                <option>Select One Option</option>
                <option>Option 1</option>
                <option>Option 2</option>
            </select>

            <label>Do you plan to buy a new car in the next 5 years?</label>
            <div class="radio-group">
                <label><input type="radio" name="buyCar"> Yes</label>
                <label><input type="radio" name="buyCar"> No</label>
                <label><input type="radio" name="buyCar"> Maybe</label>
            </div>

            <label>What is your favorite car brand?</label>
            <select>
                <option>Select One Option</option>
                <option>Toyota</option>
                <option>Ford</option>
                <option>BMW</option>
            </select>

            <label>What type of means of transportation do you own?</label>
            <div class="checkbox-group">
                <label><input type="checkbox"> Car</label>
                <label><input type="checkbox"> Boat</label>
                <label><input type="checkbox"> Bicycle</label>
                <label><input type="checkbox"> Motorcycle</label>
                <label><input type="checkbox"> Plane</label>
                <label><input type="checkbox"> Bike</label>
            </div>

            <label>Any comments or suggestions?</label>
            <textarea placeholder="Please enter your comments"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
